<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" />
    <meta
      name="description"
      content="Look up Pokémon, moves, abilities, items and type matchups, compare base stats, and keep track of the Pokémon you own."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pokédex" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/pokedex-icon.svg" />
    <link rel="apple-touch-icon" href="/pokedex-apple-touch.png" />
    <title>Pokédex</title>
    <style>
      /* Painted before the stylesheet loads, so opening the app never flashes the wrong theme. */
      html {
        background: #f4f4f5;
      }
      html[data-theme='dark'] {
        background: #101012;
      }
    </style>
    <script>
      // Runs before first paint. src/lib/theme.ts keeps this in sync afterwards.
      try {
        var stored = localStorage.getItem('pokedex:theme:v1')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
